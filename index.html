<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chim Bay">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2a41">
<title>Chim Bay 2.0</title>
<style>
:root{--bg:#2f4a6d;--card:rgba(14,20,40,.82);--acc:#ffd166;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a41}}
:root[data-theme="dark"]{--bg:#1b2a41}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
#c{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#menuBtn{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:9px 14px;border-radius:20px;background:var(--card)}
#menu{position:fixed;inset:0;overflow:auto;touch-action:pan-y;background:rgba(10,14,30,.76);padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px));text-align:center}
[hidden]{display:none!important}
h2{margin:6px 0 2px;font-size:26px}
h3{margin:18px 0 8px;font-size:13px;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opt{background:var(--card);border:2px solid transparent;border-radius:14px;padding:6px;min-width:66px}
.opt.on,.bgo.on{border-color:var(--acc)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:#fff}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
.bgo{height:64px;border-radius:12px;color:#fff;text-shadow:0 1px 3px #000;font-size:13px;border:2px solid transparent;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
#play{margin-top:22px;padding:14px 46px;border-radius:26px;background:var(--acc);color:#2a1c00;font-size:18px;font-weight:700}
.sub{opacity:.8;font-size:13px}
#dock{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.dk{padding:11px 20px;border-radius:24px;background:var(--card);font-size:15px}
#sheet{position:fixed;inset:0;background:rgba(5,8,20,.5);display:flex;align-items:flex-end;justify-content:center}
.card{width:100%;max-width:480px;max-height:78%;overflow:auto;touch-action:pan-y;background:rgba(16,22,44,.96);border-radius:22px 22px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
.grid{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.grid .opt{min-width:0;padding:6px 4px}
.opt canvas{width:100%;max-width:72px;height:auto}
.grid .sw{width:100%;height:44px;border-radius:10px;border:0;margin-bottom:4px}
#shX{margin-top:14px;padding:10px 30px;border-radius:20px;background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dock" hidden><button class="dk" id="bChar">Nhân vật</button><button class="dk" id="bBg">Bối cảnh</button></div>
<div id="sheet" hidden><div class="card"><h3 id="shT"></h3><div id="shG"></div><button id="shX">Đóng</button></div></div>
<script>
const $ = id => document.getElementById(id), cv = $('c'), ctx = cv.getContext('2d');
const W = 360, GY = 560, BR = 14, PW = 58, G = 1500, FLAP = -430, MAXS = 100;
const FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';
const COLS = ['#ffd166', '#ff6b6b', '#4ecdc4', '#a78bfa', '#7bd88f', '#f1f1f1'];
const CH = ['Chim', 'Thiên thạch', 'Cá', 'Rồng con', 'UFO', 'Hề đêm', 'Nhện nhảy', 'Phi hành gia', 'Rồng 3 đầu', 'Cú học chữ', 'Máy bay cánh quạt'], LV = ['Dễ', 'Thường', 'Khó', 'Rất khó', 'Cực khó'];
// màu cột: [thân, sáng, tối, viền]
const PS = {
  stone: ['#c9974e', '#f0c27a', '#8a5a28', '#2a1a0a'], jade: ['#1fbf8f', '#7dffd6', '#0f7a5c', '#0b3d30'],
  bamboo: ['#f0a93a', '#ffe08a', '#b86a10', '#3b1f06'], neon: ['#9dff3a', '#efffb8', '#4fb81a', '#10240a'],
  ice: ['#2f78dc', '#9bd6ff', '#143f95', '#071a3d'], coral: ['#ff6b5a', '#ffb0a0', '#c23a2a', '#4a0f08'],
  hazard: ['#ff8a1f', '#ffc266', '#b85a0a', '#1a0f05'], taxi: ['#ffd21f', '#fff08a', '#d9a000', '#2a2200'], metal: ['#c8d3e0', '#f4f8ff', '#7a8aa0', '#0a1230'],
  rig: ['#ffc21a', '#ffe680', '#c28a00', '#2a1d00'], books: ['#457bff', '#9bb8ff', '#2a4fb8', '#0a1a24'], tower: ['#e8352f', '#ff8a80', '#a81410', '#3a0806']
};
// lớp: [loại, hệ số trôi, đường nền, độ cao, màu, phụ]
const BG = [
  {n: 'Hoàng hôn', s: ['#2f4a6d', '#d98e73', '#f4c58f'], orb: [280, 300, 36, '#ffecc8'], amb: 'cloud', gr: ['#8d6e43', '#c9a36b', '#b78b55'], pipe: 'stone',
   L: [['peak', .1, 420, 120, '#a06f80', '#f6d1b8'], ['hill', .25, 470, 60, '#7d5069'], ['hill', .45, 515, 36, '#563a66']]},
  {n: 'Đêm sao', s: ['#070b22', '#1b2858', '#3b4a8a'], orb: [90, 120, 26, '#f4f1d0'], amb: 'stars', gr: ['#25305e', '#161e44', '#202a55'], pipe: 'jade',
   L: [['peak', .1, 430, 110, '#1e2a5c', '#6f7fc0'], ['hill', .25, 480, 56, '#162048'], ['tree', .5, 540, 70, '#0c1233', 'pine']]},
  {n: 'Rừng nhiệt đới', s: ['#7fd1c7', '#a8e6a1', '#e9f7b5'], orb: [260, 140, 30, '#fff6b0'], amb: 'flies', gr: ['#2e7d32', '#6b4f2a', '#5a4023'], pipe: 'bamboo',
   L: [['hill', .12, 420, 90, '#6fbf8a'], ['hill', .28, 475, 55, '#3f9d68'], ['tree', .5, 545, 95, '#1f6b45', 'palm']]},
  {n: 'Thành phố neon', s: ['#12062b', '#5b1a8f', '#ff5f9e'], orb: [250, 330, 34, '#ffd1ec'], amb: 'none', gr: ['#ff4fd8', '#1a0b33', '#2b1450'], pipe: 'neon',
   L: [['city', .12, 470, 150, '#2b1157', '#ff9ad5'], ['city', .3, 520, 120, '#1c0c40', '#5ff2ff'], ['city', .5, 560, 80, '#10051f', '#ffd166']]},
  {n: 'Núi tuyết', s: ['#8fb9de', '#cfe4f4', '#f3f9fd'], orb: [90, 110, 28, '#fffbe6'], amb: 'snow', gr: ['#ffffff', '#e6f1f9', '#c8dceb'], pipe: 'ice',
   L: [['peak', .1, 430, 150, '#b6cde2', '#ffffff'], ['peak', .25, 490, 95, '#93b1cc', '#f2f8fd'], ['tree', .5, 550, 60, '#5f86a6', 'pine']]},
  {n: 'Đáy biển', s: ['#0b5c9a', '#0a3f73', '#06213f'], orb: [250, 90, 40, 'rgba(200,240,255,.3)'], amb: 'bubbles', gr: ['#c9b27c', '#a58f5c', '#8f7a4c'], pipe: 'coral',
   L: [['hill', .1, 430, 80, '#0f5f95'], ['hill', .25, 490, 50, '#0b4a78'], ['kelp', .5, 560, 110, '#1f9a74']]},
  {n: 'Thành phố đêm', s: ['#04060d', '#101c28', '#27384a'], orb: [270, 110, 34, '#d8e4ea'], amb: 'none', gr: ['#2b353d', '#141a20', '#2b353d'], pipe: 'hazard',
   L: [['city', .12, 450, 170, '#0b1620', '#c9a227'], ['city', .3, 505, 130, '#08111a', '#e0b84a'], ['city', .5, 555, 90, '#04080f', '#8a7a30']]},
  {n: 'Phố New York', s: ['#4fa8ee', '#9fd6fa', '#e6f5ff'], orb: [80, 100, 32, '#fff2a8'], amb: 'cloud', gr: ['#a9a9ad', '#6b6b72', '#8a8a92'], pipe: 'taxi',
   L: [['city', .12, 450, 170, '#8fb0c8', '#e6f4ff'], ['city', .3, 505, 140, '#b0705c', '#ffe9a0'], ['city', .5, 555, 100, '#6e7f8e', '#cfe8f7']]},
  {n: 'Vũ trụ', s: ['#02020a', '#0b0a2a', '#2a1450'], orb: [270, 150, 50, '#c0643c'], amb: 'stars', gr: ['#5a4a8a', '#1a1236', '#2a1f55'], pipe: 'metal',
   L: [['hill', .1, 470, 70, '#241553'], ['peak', .3, 505, 60, '#1a1040', '#8a5cff'], ['peak', .5, 548, 46, '#0c0820', '#5a3cc0']]},
  {n: 'Biển chiến đấu', s: ['#0a1226', '#1b2f55', '#35577e'], orb: [90, 100, 30, 'rgba(200,220,255,.25)'], amb: 'rain', gr: ['#1f3d5a', '#0d1d33', '#162a45'], pipe: 'rig',
   L: [['hill', .12, 470, 36, '#16385e'], ['hill', .28, 505, 30, '#10294a'], ['hill', .5, 540, 26, '#0a1c36']]},
  {n: 'Thế giới chữ', s: ['#10253d', '#1c4a63', '#2f7a8a'], orb: [270, 120, 34, 'rgba(255,240,170,.45)'], amb: 'none', gr: ['#e8d9b0', '#bfa86a', '#d2bd85'], pipe: 'books',
   L: [['glyph', .1, 450, 120, 'rgba(120,200,220,.22)'], ['glyph', .25, 500, 90, 'rgba(120,210,200,.3)'], ['glyph', .5, 548, 64, 'rgba(20,50,70,.75)']]},
  {n: 'Trên mây', s: ['#3a8fe0', '#7cc4f5', '#ffe6c0'], orb: [200, 430, 46, '#fff0b0'], amb: 'cloud', gr: ['#ffffff', '#e8f1fb', '#cfe0f2'], pipe: 'tower',
   L: [['cbank', .1, 430, 60, '#e1edfb'], ['cbank', .25, 485, 66, '#f1f6ff'], ['cbank', .5, 545, 74, '#ffffff']]}
];
let sel = {ch: 0, bg: 0, col: 0}, best = 0;
try {
  const s = JSON.parse(localStorage.getItem('cb2-sel') || 'null');
  if (s && BG[s.bg] && CH[s.ch]) sel = {ch: s.ch, bg: s.bg, col: 0};
  best = +localStorage.getItem('cb2-best') || 0;
} catch (e) { /* bỏ qua */ }
const save = () => { try { localStorage.setItem('cb2-sel', JSON.stringify(sel)); } catch (e) { /* bỏ qua */ } };
let sc = 1, ox = 0, oy = 0, dpr = 1, cw = 0, ch = 0;
let state = 'ready', bird, pipes, score = 0, t = 0, overAt = 0, groundX = 0, scroll = 0, paused = false, countdown = 0;
let speedNow = 120, spawned = 0, parts = [], trail = [], shake = 0, flash = 0, pop = 0, banner = 0, bannerTxt = '', flapT = 0, amb = [], fx = [];

function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = r.width; ch = r.height;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  sc = Math.min(cw / W, ch / 640);
  ox = (cw - W * sc) / 2; oy = (ch - 640 * sc) / 2;
  initFx();
}
const rightEdge = () => (cw - ox) / sc, leftEdge = () => -ox / sc, topEdge = () => -oy / sc;
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const sh = (c, f) => { const n = parseInt(c.slice(1), 16); return 'rgb(' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v * (1 - f))).join(',') + ')'; };
const lvl = () => Math.min(4, Math.floor(score / 20));

function initAmb() {
  const ty = BG[sel.bg].amb, N = {cloud: 5, stars: 40, snow: 45, flies: 22, bubbles: 30, none: 0, rain: 60}[ty], L = leftEdge(), R = rightEdge();
  amb = [];
  for (let i = 0; i < N; i++) {
    amb.push({i, ty, x: L + Math.random() * (R - L), s: .6 + Math.random() * .9,
      y: ty === 'cloud' ? 40 + Math.random() * 220 : ty === 'stars' ? Math.random() * GY * .55 : ty === 'flies' ? 300 + Math.random() * 240 : Math.random() * GY});
  }
}
function reset() {
  bird = {x: 110, y: 300, vy: 0, rot: 0}; pipes = []; score = 0; state = 'ready';
  paused = false; countdown = 0; speedNow = 120; spawned = 0;
  parts = []; trail = []; shake = 0; flash = 0; pop = 0; banner = 0;
}
function burst(x, y, n, c, sp, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = sp * (.35 + Math.random() * .65);
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .2, l: life * (.6 + Math.random() * .4), m: life, c, r: 2 + Math.random() * 3});
  }
}
function btns() {
  if (state !== 'play') return [];
  const x = rightEdge() - 32, y = topEdge() + 34;
  return [{id: paused ? 'resume' : 'pause', x: x - 52, y, r: 22}, {id: 'reset', x, y, r: 22}];
}
function pause() { if (state === 'play' && !paused && countdown <= 0) paused = true; }
function resume() { if (paused) { paused = false; countdown = 2.4; } }

// ---- Âm thanh ----
let ac = null;
function ensureAudio() {
  try {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
    if (ac && ac.state === 'suspended') ac.resume();
  } catch (e) { /* bỏ qua */ }
}
function snd(f, d, type, v) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) { /* bỏ qua */ }
}

// ---- Điều khiển ----
function flap() {
  ensureAudio();
  if (paused || countdown > 0 || !$('sheet').hidden) return;
  if (state === 'ready') state = 'play';
  if (state === 'play') {
    bird.vy = FLAP; flapT = 1;
    snd(480 + Math.random() * 120, .08, 'square', .04);
    burst(bird.x - 10, bird.y + 8, 5, '255,255,255', 90, .4);
  } else if ((state === 'over' || state === 'win') && performance.now() - overAt > 600) reset();
}
function press(id) {
  ensureAudio();
  if (id === 'pause') pause(); else if (id === 'resume') resume(); else if (id === 'reset') reset();
}
addEventListener('pointerdown', e => {
  if (e.target !== cv) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left - ox) / sc, y = (e.clientY - r.top - oy) / sc;
  const b = btns().find(b => Math.hypot(x - b.x, y - b.y) <= b.r + 10);
  if (b) { press(b.id); return; }
  if (paused) { resume(); return; }
  flap();
}, {passive: false});
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); flap(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (paused) resume(); else pause(); }
  else if (e.code === 'KeyR') reset();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

function endRun(win) {
  if (state === 'over' || state === 'win') return;
  state = win ? 'win' : 'over'; overAt = performance.now();
  if (score > best) { best = score; try { localStorage.setItem('cb2-best', String(best)); } catch (e) { /* bỏ qua */ } }
  if (win) {
    flash = .8; snd(660, .5, 'triangle', .09);
    ['255,209,102', '255,107,107', '78,205,196', '167,139,250', '255,255,255'].forEach(c => burst(W / 2, 220, 16, c, 330, 1.6));
  } else {
    snd(160, .3, 'sawtooth', .07); shake = 14; flash = .7;
    burst(bird.x, bird.y, 22, '255,209,102', 280, .9); burst(bird.x, bird.y, 10, '244,162,89', 200, .8);
  }
}

// ---- Cập nhật ----
function update(dt) {
  t += dt;
  const L = leftEdge(), R = rightEdge();
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.l -= dt; }
  parts = parts.filter(p => p.l > 0);
  for (const q of trail) { q.x -= speedNow * dt; q.l -= dt; }
  trail = trail.filter(q => q.l > 0);
  shake = Math.max(0, shake - 40 * dt); flash = Math.max(0, flash - 2.5 * dt);
  pop = Math.max(0, pop - 4 * dt); banner = Math.max(0, banner - dt); flapT = Math.max(0, flapT - 6 * dt);
  for (const a of amb) {
    if (a.ty === 'cloud') { a.x -= 8 * a.s * dt; if (a.x < L - 100) a.x = R + 90; }
    else if (a.ty === 'snow') { a.y += (28 + 20 * a.s) * dt; a.x += Math.sin(t + a.i) * 12 * dt - 6 * dt; if (a.y > GY) { a.y = -6; a.x = L + Math.random() * (R - L); } }
    else if (a.ty === 'bubbles') { a.y -= (24 + 18 * a.s) * dt; a.x += Math.sin(t * 2 + a.i) * 10 * dt; if (a.y < -6) { a.y = GY; a.x = L + Math.random() * (R - L); } }
    else if (a.ty === 'flies') { a.x += Math.sin(t * .9 + a.i) * 20 * dt; a.y += Math.cos(t * .7 + a.i * 2) * 14 * dt; }
    else if (a.ty === 'rain') { a.y += 420 * dt; a.x -= 70 * dt; if (a.y > GY) { a.y = -10; a.x = L + Math.random() * (R - L) + 60; } }
  }
  for (const a of fx) {
    if (a.ty === 'shoot') {
      if (a.l > 0) { a.x -= 230 * dt; a.y += 115 * dt; a.l -= dt; }
      else if ((a.w -= dt) < 0) { a.l = .9; a.x = L + 120 + Math.random() * (R - L - 100); a.y = 10 + Math.random() * 160; a.w = 2 + Math.random() * 5; }
    } else if (a.ty === 'bfly') { a.x += Math.sin(t * .7 + a.ph) * 14 * dt - 5 * dt; a.y += Math.cos(t * 1.3 + a.ph) * 22 * dt; if (a.x < L - 20) a.x = R + 20; }
    else if (a.ty === 'jelly') { a.y += Math.sin(t * .8 + a.ph) * 10 * dt; a.x += Math.sin(t * .3 + a.ph) * 6 * dt - 4 * dt; if (a.x < L - 30) a.x = R + 30; }
    else if (a.ty === 'card') { a.y += (26 + a.s * 10) * dt; a.x += Math.sin(t + a.ph) * 10 * dt; if (a.y > GY) a.y = -10; }
    else if (a.ty === 'glyph') { a.y -= (14 + a.s * 10) * dt; a.x += Math.sin(t * .5 + a.ph) * 8 * dt; if (a.y < -20) a.y = GY + 10; }
    else if (a.ty === 'boom' || a.ty === 'bolt') {
      if (a.l > 0) a.l -= dt;
      else if ((a.w -= dt) < 0) {
        a.l = a.ty === 'bolt' ? .3 : .5; a.w = 1 + Math.random() * 3.5;
        a.x = a.ty === 'bolt' ? L + Math.random() * (R - L) : sel.bg === 9 ? R - 190 + Math.random() * 120 : L + Math.random() * (R - L);
        a.y = sel.bg === 9 ? 280 + Math.random() * 130 : 60 + Math.random() * 330;
      }
    }
    else { a.x += a.v * dt; if (a.v > 0 && a.x > R + 70) a.x = L - 70; else if (a.v < 0 && a.x < L - 70) a.x = R + 70; }
  }
  if (state !== 'play' && state !== 'over') {
    bird.y = 300 + Math.sin(t * 4) * 8; bird.rot = 0;
    scroll += 40 * dt; groundX = (groundX + 40 * dt) % 24;
    return;
  }
  if (state === 'over') {
    bird.vy += G * dt;
    bird.y = Math.min(bird.y + bird.vy * dt, GY - BR);
    bird.rot = Math.min(bird.rot + 6 * dt, 1.5);
    return;
  }
  const wv = Math.max(0, Math.min(1, (score - 60) / 40));
  bird.vy += G * dt + Math.sin(t * .8) * Math.sin(t * .33 + 1) * 420 * wv * dt;
  bird.y += bird.vy * dt;
  bird.rot = Math.max(-.45, Math.min(1.2, bird.vy / 520));
  speedNow += (120 + 110 * Math.min(score, MAXS) / MAXS - speedNow) * Math.min(1, dt * 1.5);
  scroll += speedNow * dt; groundX = (groundX + speedNow * dt) % 24;
  trail.push({x: bird.x - 6, y: bird.y, l: .3});
  if (spawned < MAXS && (!pipes.length || pipes[pipes.length - 1].x < R - (speedNow * .9 + 8))) {
    const n = ++spawned, d = n / MAXS, gap = 152 - 50 * d, amp = n > 40 ? (n - 40) / 60 * 40 : 0;
    const lo = 60 + amp, rg = GY - 120 - gap - 2 * amp, pv = pipes.length ? pipes[pipes.length - 1].top0 : -1;
    let top0 = lo + Math.random() * rg;
    if (pv > 0 && Math.abs(top0 - pv) < 80) top0 = Math.min(lo + rg, Math.max(lo, pv + (Math.random() < .5 ? -1 : 1) * (80 + Math.random() * 60)));

    text('Mức: ' + LV[lvl()] + '  ·  Cao nhất: ' + best, W / 2, 316, 17);
    if (performance.now() - overAt > 600) { ctx.globalAlpha = pulse; text('Chạm để chơi lại', W / 2, 365, 18); ctx.globalAlpha = 1; }
  }
}

// ---- Chọn nhân vật / bối cảnh (bấm nút rồi chọn) ----
const sheet = $('sheet'), dock = $('dock');
function el(tag, cls, html, fn) { const e = document.createElement(tag); e.className = cls; e.innerHTML = html || ''; e.onclick = fn; return e; }
function openSheet(kind) {
  const grid = $('shG'), isCh = kind === 'ch';
  grid.innerHTML = ''; grid.className = 'grid';
  $('shT').textContent = isCh ? 'Chọn nhân vật' : 'Chọn bối cảnh';
  (isCh ? CH : BG.map(b => b.n)).forEach((n, i) => {
    const on = (isCh ? sel.ch : sel.bg) === i;
    const b = el('button', 'opt' + (on ? ' on' : ''), (isCh ? '<canvas width="72" height="64"></canvas>' : '<div class="sw"></div>') + '<div>' + n + '</div>', () => {
      if (isCh) sel.ch = i; else { sel.bg = i; if (i >= 6) sel.ch = i - 1; initFx(); }
      save(); sheet.hidden = true;
    });
    if (isCh) { const g = b.firstChild.getContext('2d'); g.translate(40, 32); drawChar(g, i, 0, true); }
    else b.firstChild.style.background = 'linear-gradient(' + BG[i].s.join(',') + ')';
    grid.appendChild(b);
  });
  sheet.hidden = false;
}
$('bChar').onclick = () => openSheet('ch');
$('bBg').onclick = () => openSheet('bg');
sheet.onclick = e => { if (e.target === sheet) sheet.hidden = true; };
$('shX').onclick = () => { sheet.hidden = true; };

reset(); resize();
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, .033); last = now;
  if (countdown > 0) { countdown -= dt; flash = 0; }
  else if (!paused) update(dt);
  const show = (state === 'ready' || state === 'over' || state === 'win') && sheet.hidden;
  if (dock.hidden === show) dock.hidden = !show;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
